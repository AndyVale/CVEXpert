[project]
name = "cvexpert"
version = "0.1.0"
description = "Evidence-backed multi-label CVE classification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3,<2",
    "langchain-core>=1.5,<2",
    "langchain-experimental>=0.4,<0.5",
    "langchain-openai>=1.4,<2",
    "langchain-text-splitters>=1.1,<2",
    "numpy>=2,<3",
    "python-dotenv>=1.2,<2",
    "requests>=2.32,<3",
    "scikit-learn>=1.8,<2",
    "tqdm>=4.67,<5",
    "trafilatura>=2.1,<3",
]

[tool.uv]
package = false
