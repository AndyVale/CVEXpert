# Copy this file to config.toml and adjust it for your deployment.
# API keys are read from the environment variables named below; never put their
# values in this file.

[chat]
base_url = "http://localhost:8000/v1"
api_key_env = "CVEXPERT_CHAT_API_KEY"
classifier_model = "openai/gpt-oss-20b"
classifier_temperature = 0.0
summarizer_model = "openai/gpt-oss-20b"
summarizer_temperature = 0.0

[embedding]
base_url = "http://localhost:8001/v1"
api_key_env = "CVEXPERT_EMBEDDING_API_KEY"
model = "Qwen/Qwen3-Embedding-4B"

[nvd]
base_url = "https://services.nvd.nist.gov/rest/json/cves/2.0"
timeout_seconds = 20

[references]
max_pages = 10

[semantic_chunker]
breakpoint_threshold_type = "percentile"
breakpoint_threshold_amount = 25.0

[cosine_filter]
query = "What type of vulnerability is it?"
threshold = 0.6

[evaluation]
log_directory = "logs/LOG_GPT_NORANDAware"
run_number = 0
